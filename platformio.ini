; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_itsybitsy_m4]
platform = atmelsam
board = adafruit_itsybitsy_m4
framework = arduino

board_build.usb_product = RF Generator
board_vendor = GAA Custom Electronics, LLC

; Build options
build_flags =
; Enable this define to build the RF generator that supports fast ramping
 ;        -DRFGEN2
; Enable this define to build the RF generator that is configurated for single ended operation
;         -DSINGLEENDED
; Enable this define to build the RF generator that supports an inverted used for the trigger input buffer
 ;        -DTRIGINVERTED
; Enable this define if the RF generator is equiped with the RF quence module for fast turn off of RF
;         -DQUENCH


lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/adafruit/Adafruit_DotStar.git
    https://github.com/cmaglie/FlashStorage.git
    https://github.com/contrem/arduino-timer.git
    https://github.com/adafruit/Adafruit_SPIFlash.git
    https://github.com/etherkit/Si5351Arduino.git
